name: Test API (Python)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
      - "master"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Python Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: valkey/valkey:7.2.11-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements/test.txt"

      - name: Install test dependencies
        run: |
          cd apps/api
          pip install -r requirements/test.txt

      - name: Run unit tests with coverage
        run: |
          cd apps/api
          python -m pytest -m unit \
            --cov=plane \
            --cov-report=term \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --junitxml=junit-results.xml \
            --timeout=60 \
            -vs --reuse-db --nomigrations
        env:
          DJANGO_SETTINGS_MODULE: plane.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: "redis://localhost:6379/"
          SECRET_KEY: "ci-test-secret-key"
          USE_MINIO: 0

      - name: Run contract tests
        run: |
          cd apps/api
          python -m pytest -m contract \
            --timeout=60 \
            -vs --reuse-db --nomigrations
        env:
          DJANGO_SETTINGS_MODULE: plane.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: "redis://localhost:6379/"
          SECRET_KEY: "ci-test-secret-key"
          USE_MINIO: 0

      - name: Check coverage threshold
        run: |
          cd apps/api
          python -m coverage report --fail-under=50
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-report
          path: apps/api/htmlcov/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: apps/api/junit-results.xml
          retention-days: 14
