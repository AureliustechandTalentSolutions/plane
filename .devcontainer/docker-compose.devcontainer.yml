services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.devcontainer
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - dev_env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-minio
    environment:
      # Connect to Docker Compose services by container name
      POSTGRES_HOST: plane-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://plane-redis:6379/"
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      AWS_S3_ENDPOINT_URL: "http://plane-minio:9000"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    ports:
      - "5672:5672"
      - "15672:15672"

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: secret-key
    ports:
      - "9000:9000"
      - "9090:9090"

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge
